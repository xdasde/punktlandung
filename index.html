<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Punktlandung</title>
<meta name="apple-mobile-web-app-title" content="Punktlandung">
<style>
  :root {
    --paper: #f7f1e6;
    --card: #fffdf8;
    --ink: #2b2a33;
    --muted: #6d6a72;
    --line: #e5dccb;
    --accent: #1f6f5c;
    --accent-soft: #dcefe8;
    --open: #fbe9b7;
    --open-ink: #6b4e00;
    --done: #d5edd9;
    --done-ink: #1c5a2c;
    --miss: #f7d9d3;
    --miss-ink: #842c1c;
    --radius: 18px;
    --tap: 64px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    background: var(--paper); color: var(--ink);
    font: 17px/1.35 ui-rounded, "SF Pro Rounded", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    padding-bottom: calc(84px + env(safe-area-inset-bottom));
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  main { max-width: 1240px; margin: 0 auto; padding: 20px 20px 12px; }
  h1 { font-size: 30px; margin: 0; letter-spacing: -.01em; }
  h2 { font-size: 21px; margin: 0 0 12px; }
  .muted { color: var(--muted); }
  .small { font-size: 15px; }

  /* Kopf */
  .top { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
  .stats { display: flex; gap: 10px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 8px 16px; }
  .stat span { display: block; font-size: 14px; color: var(--muted); }
  .stat b { font-size: 22px; font-variant-numeric: tabular-nums; }

  /* Personen-Kacheln */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 12px; margin-bottom: 22px; }
  .tile {
    background: var(--card); border: 2px solid var(--line); border-radius: var(--radius);
    padding: 12px 8px; text-align: center; min-height: 112px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  }
  .tile .emo { font-size: 38px; line-height: 1.15; }
  .tile .name { font-weight: 650; }
  .tile .sub { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .tile.on { border-color: var(--c, var(--accent)); box-shadow: inset 0 0 0 2px var(--c, var(--accent)); background: #fff; }
  .tile:disabled { opacity: .42; cursor: not-allowed; }

  /* Aufgaben */
  .cols { display: grid; grid-template-columns: 1fr; gap: 22px; }
  @media (min-width: 880px) { .cols { grid-template-columns: 3fr 2fr; } }
  .list { display: flex; flex-direction: column; gap: 8px; }
  .row {
    width: 100%; min-height: var(--tap); text-align: left;
    display: flex; align-items: center; gap: 12px; padding: 8px 14px;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    border-left: 6px solid var(--c, var(--line));
  }
  .row .emo { font-size: 26px; width: 34px; text-align: center; flex: none; }
  .row .what { flex: 1; min-width: 0; }
  .row .what b { display: block; font-weight: 620; }
  .row .pts { color: var(--muted); font-size: 15px; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .row.done { background: transparent; }
  .row.done .what b { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 1px; }
  .pill { font-size: 14px; font-weight: 600; padding: 5px 11px; border-radius: 999px; white-space: nowrap; }
  .pill.open { background: var(--open); color: var(--open-ink); }
  .pill.done { background: var(--done); color: var(--done-ink); }
  .pill.miss { background: var(--miss); color: var(--miss-ink); }
  .empty { padding: 18px; color: var(--muted); border: 1px dashed var(--line); border-radius: 14px; text-align: center; }

  /* Karten */
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 18px; }
  .rewards { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
  .reward { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; min-height: 96px; text-align: left; display: flex; flex-direction: column; justify-content: space-between; gap: 8px; }
  .reward b { font-weight: 620; }
  .reward span { color: var(--muted); font-variant-numeric: tabular-nums; }

  /* Tabellen */
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 16px; }
  th { text-align: left; font-size: 14px; color: var(--muted); font-weight: 600; white-space: nowrap; }
  th, td { padding: 10px; border-bottom: 1px solid var(--line); }
  tbody tr.click { cursor: pointer; }
  tbody tr.click:hover { background: #fbf6ec; }
  tr.inactive td { color: var(--muted); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }

  /* Verwaltung */
  .subnav { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 16px; padding-bottom: 2px; }
  .subnav button { padding: 10px 15px; border-radius: 999px; white-space: nowrap; background: transparent; border: 1px solid var(--line); min-height: 46px; }
  .subnav button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .bar-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .bar-head h2 { margin: 0; }
  .btn { padding: 11px 18px; border-radius: 12px; font-weight: 620; background: var(--accent); color: #fff; min-height: 46px; }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .btn.danger { background: transparent; color: var(--miss-ink); border: 1px solid #e3b3a8; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  /* Statistik */
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 18px; }
  .grid2 .panel { margin: 0; }
  .bars { display: flex; flex-direction: column; gap: 10px; }
  .bar { display: grid; grid-template-columns: 130px 1fr 62px; gap: 10px; align-items: center; font-size: 16px; }
  .bar .track { height: 12px; }
  .bar .fill { height: 12px; background: var(--accent); border-radius: 0 4px 4px 0; }
  .bar .val { text-align: right; font-variant-numeric: tabular-nums; }
  .bar .lbl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Navigation */
  nav.main {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    display: grid; grid-template-columns: repeat(4, 1fr);
    background: var(--card); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav.main button { padding: 9px 4px 10px; min-height: 72px; color: var(--muted); font-size: 15px; font-weight: 600; }
  nav.main .emo { display: block; font-size: 25px; }
  nav.main button.on { color: var(--ink); box-shadow: inset 0 3px 0 var(--accent); }

  /* Dialog */
  .veil { position: fixed; inset: 0; background: rgba(40,35,30,.45); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  .modal { background: var(--card); border-radius: 22px; padding: 22px; width: min(560px, 100%); max-height: calc(100% - 32px); overflow: auto; }
  .modal h2 { font-size: 23px; }
  .field { display: block; margin-bottom: 12px; }
  .field > span { display: block; font-size: 15px; color: var(--muted); margin-bottom: 4px; }
  .field input:not([type=checkbox]):not([type=radio]), .field select { width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; min-height: 48px; }
  .check { display: flex; align-items: center; gap: 10px; min-height: 44px; margin-bottom: 8px; }
  .check input { width: 22px; height: 22px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
  .actions .left { margin-right: auto; }
  .swatches { display: flex; gap: 10px; flex-wrap: wrap; }
  .swatches input { position: absolute; opacity: 0; }
  .swatches i { display: block; width: 42px; height: 42px; border-radius: 50%; border: 3px solid transparent; }
  .swatches input:checked + i { border-color: var(--ink); }
  .swatches input:focus-visible + i { outline: 3px solid var(--accent); outline-offset: 2px; }
  .emojis { display: flex; gap: 6px; flex-wrap: wrap; }
  .emojis label { cursor: pointer; }
  .emojis input { position: absolute; opacity: 0; }
  .emojis i { display: flex; align-items: center; justify-content: center; width: 50px; height: 50px; font-size: 27px; font-style: normal; border-radius: 12px; border: 2px solid var(--line); }
  .emojis input:checked + i { border-color: var(--accent); background: var(--accent-soft); }
  .emojis input:focus-visible + i { outline: 3px solid var(--accent); outline-offset: 2px; }
  .demo-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; background: var(--accent-soft); border-radius: 14px; padding: 10px 14px; margin-bottom: 16px; }
  .steps { font-size: 15px; color: var(--muted); margin-bottom: 4px; }
  .hidden { display: none !important; }

  .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(92px + env(safe-area-inset-bottom)); background: var(--ink); color: #fff; padding: 11px 18px; border-radius: 12px; z-index: 20; }
</style>
</head>
<body>
<main id="app"></main>
<nav class="main" id="nav" aria-label="Hauptbereiche"></nav>
<div id="modal"></div>
<div id="toast" aria-live="polite"></div>

<script>
'use strict';
/* ==========================================================================
   Speicher-Schnittstelle
   Die App spricht nur mit Store. Die Daten liegen lokal auf dem Gerät.
   Ein späteres GitHub-Backup kann denselben JSON-Stand verwenden, den die
   Sicherung in den Einstellungen als Datei schreibt.
   ========================================================================== */
const LocalStore = {
  key: 'familienaufgaben.v1',
  load() { try { return JSON.parse(localStorage.getItem(this.key)); } catch { return null; } },
  save(s) { try { localStorage.setItem(this.key, JSON.stringify(s)); } catch { /* z. B. privater Modus */ } },
  clear() { try { localStorage.removeItem(this.key); } catch {} },
};
const Store = LocalStore;

/* --------- Hilfen --------- */
const WEEKDAYS = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const MONTHS = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const COLORS = ['#3b6fb5','#c2528b','#2f8f6b','#d9822b','#7a5cc0','#b8483a'];
const EMOJIS = ['👨','👩','🧑','👦','👧','🐼','🐰','🦊','🐻','🐯','🐸','🦄'];
const pad = n => String(n).padStart(2, '0');
const dateKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate()+n); return dateKey(d); };
const diffDays = (a, b) => { // a - b, sommerzeitfest
  const [ay,am,ad] = a.split('-').map(Number), [by,bm,bd] = b.split('-').map(Number);
  return Math.round((Date.UTC(ay,am-1,ad) - Date.UTC(by,bm-1,bd)) / 864e5);
};
const today = () => dateKey(new Date());
const fmtDate = k => { const [y,m,d] = k.split('-'); return `${d}.${m}.${y}`; };
const fmtShort = k => { const [,m,d] = k.split('-'); return `${d}.${m}.`; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = s => document.querySelector(s);

/* --------- Demodaten --------- */
function emptyState() {
  return { familyName: 'Unsere Familie', pin: '1234', demo: false, lastClosed: addDays(today(), -1),
           members: [], tasks: [], rewards: [], taskHistory: [], rewardHistory: [] };
}
const sampleRewards = () => [
  ['🍦 Eis',25],['🎮 30 Minuten Switch',40],['🧸 Kleine Überraschung',50],['🍕 Lieblingsessen',75],
  ['🍿 Kinoabend',100],['🛍️ 10€ Wunschbudget',250],['🎳 Familienausflug auswählen',500],
].map(([name,cost],i) => ({ id:'r'+i, name, cost, active:true }));
/* Beispielaufgaben für die Einrichtung, ohne Bezug zu einzelnen Personen */
const sampleTasks = () => [
  ['Bett machen','Pflicht','alle',1,1,'taeglich'],['Zähne putzen','Pflicht','alle',1,2,'taeglich'],
  ['Müll rausbringen','Bonus','offen',5,1,'taeglich'],['Tisch abräumen','Bonus','offen',2,3,'taeglich'],
  ['Saugen','Bonus','offen',20,1,'intervall'],
].map(([name,type,person,points,times,rec],i) =>
  ({ id:'t'+i, name, type, person, points, times, rec, interval:3, weekday:1, active:true, start:today() }));
function demoState() {
  const s = emptyState();
  s.demo = true;
  const t0 = addDays(today(), -90);
  s.members = [
    { id:'m1', name:'Alex', emoji:'👨', color:COLORS[0], active:true },
    { id:'m2', name:'Sam', emoji:'👩', color:COLORS[1], active:true },
    { id:'m3', name:'Mia', emoji:'🐼', color:COLORS[2], active:true },
    { id:'m4', name:'Leo', emoji:'🐰', color:COLORS[3], active:true },
  ];
  const task = (id,name,type,person,points,rec='taeglich',extra={}) =>
    ({ id,name,type,person,points,rec,interval:3,weekday:3,times:1,active:true,start:t0,...extra });
  s.tasks = [
    task('t1','Zähne putzen','Pflicht','m3',1,'taeglich',{times:2}),
    task('t2','Schulranzen packen','Pflicht','m3',2),
    task('t3','Bett machen','Pflicht','alle',1),
    task('t4','Zähne putzen','Pflicht','m4',1,'taeglich',{times:2}),
    task('t5','Spülmaschine ausräumen','Pflicht','m1',2),
    task('t6','Wäsche aufhängen','Pflicht','m2',2),
    task('t7','Müll rausbringen','Bonus','offen',5),
    task('t8','Saugen','Bonus','offen',20),
    task('t9','Tisch abräumen','Bonus','offen',2,'taeglich',{times:3}),
    task('t10','Biomüll','Bonus','offen',10,'wochentag',{weekday:3}),
    task('t11','Blumen gießen','Bonus','offen',5,'intervall',{interval:3}),
  ];
  s.rewards = sampleRewards();

  // Reproduzierbare Beispiel-Historie der letzten 90 Tage
  let seed = 42; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let n = 90; n >= 1; n--) {
    const day = addDays(today(), -n);
    for (const inst of instances(s, day)) {
      if (inst.task.type === 'Pflicht') {
        const ok = rnd() < .84;
        s.taskHistory.push(entry(day, inst, inst.memberId, ok));
      } else if (rnd() < .4) {
        s.taskHistory.push(entry(day, inst, s.members[Math.floor(rnd()*4)].id, true));
      }
    }
    if (n > 3 && rnd() < .12) {
      const r = s.rewards[Math.floor(rnd()*4)];
      s.rewardHistory.push({ id:uid(), date:day, memberId:s.members[Math.floor(rnd()*4)].id, name:r.name, cost:r.cost });
    }
  }
  s.rewardHistory.push({ id:uid(), date:addDays(today(),-2), memberId:'m4', name:'🎮 30 Minuten Switch', cost:40 });
  s.rewardHistory.push({ id:uid(), date:addDays(today(),-1), memberId:'m3', name:'🍦 Eis', cost:25 });
  // Für heute schon etwas erledigt
  const inst = instances(s, today());
  const pick = (tid) => inst.find(i => i.task.id === tid);
  if (pick('t2')) s.taskHistory.push(entry(today(), pick('t2'), 'm3', true));
  if (pick('t7')) s.taskHistory.push(entry(today(), pick('t7'), 'm3', true));
  return s;
}

/* --------- Fachlogik --------- */
function isDue(task, day) {
  if (!task.active || day < task.start) return false;
  if (task.rec === 'wochentag') return parseKey(day).getDay() === Number(task.weekday);
  if (task.rec === 'intervall') return diffDays(day, task.start) % Math.max(1, Number(task.interval)) === 0;
  return true;
}
/* Tagesaufgaben werden aus den Regeln berechnet, nicht vorab gespeichert. */
function instances(s, day) {
  const out = [];
  const active = s.members.filter(m => m.active);
  for (const task of s.tasks) {
    if (!isDue(task, day)) continue;
    const people = task.type === 'Bonus' ? [null]
      : task.person === 'alle' ? active.map(m => m.id)
      : active.some(m => m.id === task.person) ? [task.person] : [];
    for (const memberId of people)
      for (let slot = 1; slot <= task.times; slot++) out.push({ task, memberId, slot });
  }
  return out;
}
function entry(day, inst, memberId, ok) {
  return { id:uid(), date:day, taskId:inst.task.id, slot:inst.slot, memberId,
           name:inst.task.name, status: ok ? 'Erledigt' : 'Nicht erledigt', points: ok ? Number(inst.task.points) : 0 };
}
function findEntry(day, inst) {
  return state.taskHistory.find(h => h.date === day && h.taskId === inst.task.id && h.slot === inst.slot
    && (inst.memberId === null || h.memberId === inst.memberId));
}
/* Punkte sind immer aus den Historien abgeleitet, nie separat gespeichert.
   Dadurch wirken Admin-Korrekturen sofort. */
function balance(memberId) {
  let sum = 0;
  for (const h of state.taskHistory) if (h.memberId === memberId && h.status === 'Erledigt') sum += Number(h.points);
  for (const h of state.rewardHistory) if (h.memberId === memberId) sum -= Number(h.cost);
  return sum;
}
/* Tagesabschluss: offene Pflichtaufgaben vergangener Tage werden zu „Nicht
   erledigt“. Läuft beim Öffnen und beim Datumswechsel; holt verpasste Tage nach. */
function closeDays() {
  const t = today();
  let day = addDays(state.lastClosed, 1);
  if (diffDays(t, day) > 62) day = addDays(t, -62);
  let changed = false;
  while (day < t) {
    for (const inst of instances(state, day))
      if (inst.task.type === 'Pflicht' && !findEntry(day, inst)) {
        state.taskHistory.push(entry(day, inst, inst.memberId, false));
        changed = true;
      }
    state.lastClosed = day; changed = true;
    day = addDays(day, 1);
  }
  if (changed) save();
}

/* --------- Zustand --------- */
let state = Store.load() || demoState();
const ui = { view:'tasks', filter:'alle', admin:'tasks', unlocked:false, day:today() };
const save = () => Store.save(state);
const member = id => state.members.find(m => m.id === id);
const activeMembers = () => state.members.filter(m => m.active);
const mName = id => member(id)?.name ?? 'Unbekannt';
const mLabel = id => { const m = member(id); return m ? `${esc(m.emoji)} ${esc(m.name)}` : 'Unbekannt'; };

/* --------- Darstellung --------- */
function render() {
  const views = { tasks:viewTasks, rewards:viewRewards, stats:viewStats, admin:viewAdmin };
  $('#app').innerHTML = views[ui.view]();
  const nav = [['tasks','📋','Aufgaben'],['rewards','🎁','Belohnungen'],['stats','📊','Statistik'],['admin','⚙️','Verwaltung']];
  $('#nav').innerHTML = nav.map(([v,e,l]) =>
    `<button data-act="nav" data-v="${v}" class="${ui.view===v?'on':''}" ${ui.view===v?'aria-current="page"':''}><span class="emo">${e}</span>${l}</button>`).join('');
}

function viewTasks() {
  const day = today();
  const all = instances(state, day).map(i => ({ ...i, h: findEntry(day, i) }));
  const f = ui.filter;
  const must = all.filter(i => i.task.type === 'Pflicht' && (f === 'alle' || i.memberId === f))
    .sort((a,b) => (!!a.h - !!b.h) || state.members.findIndex(m=>m.id===a.memberId) - state.members.findIndex(m=>m.id===b.memberId));
  const bonus = all.filter(i => i.task.type === 'Bonus').sort((a,b) => !!a.h - !!b.h);
  const open = must.filter(i => !i.h).length + bonus.filter(i => !i.h).length;
  const openOf = id => all.filter(i => !i.h && i.memberId === id).length;

  const tiles = activeMembers().map(m =>
    `<button class="tile ${f===m.id?'on':''}" style="--c:${esc(m.color)}" data-act="filter" data-id="${m.id}" aria-pressed="${f===m.id}">
       <span class="emo">${esc(m.emoji)}</span><span class="name">${esc(m.name)}</span><span class="sub">${openOf(m.id)} offen</span></button>`).join('')
    + `<button class="tile ${f==='alle'?'on':''}" data-act="filter" data-id="alle" aria-pressed="${f==='alle'}">
       <span class="emo">👨‍👩‍👧‍👧</span><span class="name">Alle</span><span class="sub">${all.filter(i=>!i.h).length} offen</span></button>`;

  const label = i => esc(i.task.name) + (i.task.times > 1 ? ` <span class="muted small">${i.slot}/${i.task.times}</span>` : '');
  const key = i => `data-task="${esc(i.task.id)}" data-slot="${i.slot}" data-member="${esc(i.memberId ?? '')}"`;
  const pflichtRows = must.map(i => { const m = member(i.memberId); return `
    <button class="row ${i.h?'done':''}" style="--c:${esc(m?.color)}" data-act="toggle" ${key(i)}>
      <span class="emo">${esc(m?.emoji)}</span>
      <span class="what"><b>${label(i)}</b><span class="muted small">${esc(m?.name)}</span></span>
      <span class="pts">${i.task.points} P</span>
      <span class="pill ${i.h?'done':'open'}">${i.h?'🟢 Erledigt':'🟡 Offen'}</span>
    </button>`; }).join('');
  const bonusRows = bonus.map(i => `
    <button class="row ${i.h?'done':''}" data-act="toggle" ${key(i)}>

function bars(rows, unit='') {
  if (!rows.length) return '<div class="muted">Noch keine Daten.</div>';
  const max = Math.max(1, ...rows.map(r => r.v));
  return `<div class="bars">${rows.map(r => `
    <div class="bar" title="${esc(r.plain)}: ${r.v}${unit}"><span class="lbl">${r.l}</span>
      <span class="track"><span class="fill" style="display:block;width:${r.v/max*100}%"></span></span>
      <span class="val">${r.v}${unit}</span></div>`).join('')}</div>`;
}
function viewStats() {
  const t = today(), from = addDays(t, -30);
  const done = state.taskHistory.filter(h => h.status === 'Erledigt');
  const label = m => ({ l:`${esc(m.emoji)} ${esc(m.name)}`, plain:m.name });
  const quote = activeMembers().map(m => {
    const hs = state.taskHistory.filter(h => h.memberId === m.id && h.date >= from && h.date < t
      && state.tasks.find(x => x.id === h.taskId)?.type !== 'Bonus');
    const ok = hs.filter(h => h.status === 'Erledigt').length;
    return { ...label(m), v: hs.length ? Math.round(ok / hs.length * 100) : 0 };
  });
  const rank = activeMembers().map(m => ({ ...label(m),
    v: done.filter(h => h.memberId === m.id).reduce((a,h) => a + Number(h.points), 0) })).sort((a,b) => b.v-a.v);
  const months = [];
  const now = new Date();
  for (let i = 5; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    const ym = `${d.getFullYear()}-${pad(d.getMonth()+1)}`;
    const name = `${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
    months.push({ l:name, plain:name, v: done.filter(h => h.date.startsWith(ym)).reduce((a,h) => a + Number(h.points), 0) });
  }
  const count = (arr, f) => { const c = {}; arr.forEach(x => c[f(x)] = (c[f(x)]||0)+1);
    return Object.entries(c).sort((a,b) => b[1]-a[1]).slice(0,5).map(([k,v]) => ({ l:esc(k), plain:k, v })); };
  return `
    <div class="top"><h1>Statistik 📊</h1></div>
    <div class="grid2">
      <div class="panel"><h2>Erledigungsquote</h2><p class="muted small" style="margin-top:-8px">Pflichtaufgaben, letzte 30 Tage</p>${bars(quote,' %')}</div>
      <div class="panel"><h2>Familienranking</h2><p class="muted small" style="margin-top:-8px">Gesammelte Punkte insgesamt</p>${bars(rank)}</div>
      <div class="panel"><h2>Punkte pro Monat</h2><p class="muted small" style="margin-top:-8px">Ganze Familie</p>${bars(months)}</div>
      <div class="panel"><h2>Top-Aufgaben</h2><p class="muted small" style="margin-top:-8px">Anzahl erledigt</p>${bars(count(done, h => h.name))}</div>
      <div class="panel"><h2>Meiste Belohnungen</h2><p class="muted small" style="margin-top:-8px">Anzahl eingelöst</p>${bars(count(state.rewardHistory, h => h.name))}</div>
    </div>`;
}

}

/* --------- Geführte Einrichtung ---------
   Der bisherige Stand wird erst im letzten Schritt ersetzt, Abbrechen ist also gefahrlos. */
let wiz = null;
function wizStart() {
  wiz = { step:1, familyName: state.demo ? '' : state.familyName, members:[], pin:'', samples:true };
  wizRender();
}
function wizRender() {
  const w = wiz, emojiFree = EMOJIS.find(e => !w.members.some(m => m.emoji === e)) ?? EMOJIS[0];
  const nav = (next) => `<div class="actions">
    <button type="button" class="btn ghost left" data-act="close">Abbrechen</button>
    ${w.step > 1 ? '<button type="button" class="btn ghost" data-act="wizBack">Zurück</button>' : ''}
    <button class="btn">${next}</button></div>`;
  const body = {
    1: `<h2>Wie heißt eure Familie?</h2>
        <label class="field"><span>Name</span><input name="familyName" value="${esc(w.familyName)}" placeholder="Familie Muster" required></label>
        ${nav('Weiter')}`,
    2: `<h2>Wer macht mit?</h2>
        ${w.members.length ? `<div class="list" style="margin-bottom:14px">${w.members.map((m,i) => `<div class="row"><span class="emo">${esc(m.emoji)}</span><span class="what"><b>${esc(m.name)}</b></span>
          <button type="button" class="btn ghost" data-act="wizDel" data-i="${i}" aria-label="${esc(m.name)} entfernen">Entfernen</button></div>`).join('')}</div>` : ''}
        <label class="field"><span>Name</span><input name="name" autocomplete="off"></label>
        <div class="field"><span>Symbol</span><div class="emojis">${EMOJIS.map(e => `<label><input type="radio" name="emoji" value="${e}" ${e===emojiFree?'checked':''}><i>${e}</i></label>`).join('')}</div></div>
        <button type="button" class="btn ghost" data-act="wizAdd">+ Hinzufügen</button>
        ${nav('Weiter')}`,
    3: `<h2>PIN für die Verwaltung</h2>
        <p class="muted">Mit der PIN schützt ihr Aufgaben, Punkte und Historie vor Änderungen. Sie lässt sich nicht zurückholen, also merkt sie euch gut.</p>
        <div class="two">
          <label class="field"><span>PIN (4 bis 8 Ziffern)</span><input name="pin" type="password" inputmode="numeric" pattern="\\d{4,8}" title="4 bis 8 Ziffern" autocomplete="off" required></label>
          <label class="field"><span>PIN wiederholen</span><input name="pin2" type="password" inputmode="numeric" autocomplete="off" required></label>
        </div>
        ${nav('Weiter')}`,
    4: `<h2>Fast fertig</h2>
        <p class="muted">${esc(w.familyName)} mit ${w.members.length} ${w.members.length === 1 ? 'Person' : 'Personen'}.</p>
        <label class="check"><input type="checkbox" name="samples" ${w.samples?'checked':''}> Beispielaufgaben und Belohnungen übernehmen</label>
        ${state.demo ? '<p class="muted small">Die Beispieldaten werden dabei gelöscht.</p>' : '<p class="muted small" style="color:var(--miss-ink)">Alle bisherigen Daten auf diesem Gerät werden dabei gelöscht.</p>'}
        ${nav('Einrichtung abschließen')}`,
  }[w.step];
  modal(`<div class="steps">Schritt ${w.step} von 4</div><form data-form="wiz">${body}</form>`);
  $('#modal input:not([type=radio]):not([type=checkbox])')?.focus();
}
function wizAddMember(form) {
  const name = form.name.value.trim();
  if (!name) return false;
  const color = COLORS[wiz.members.length % COLORS.length];
  wiz.members.push({ id:uid(), name, emoji:form.emoji.value, color, active:true });
  return true;
}
function wizSubmit(form, fd) {
  const w = wiz;
  if (w.step === 1) w.familyName = fd.get('familyName').trim();
  if (w.step === 2) {
    wizAddMember(form); // Name eingetippt, aber nicht hinzugefügt
    if (!w.members.length) { toast('Bitte mindestens eine Person eintragen'); return; }
  }
  if (w.step === 3) {
    if (fd.get('pin') !== fd.get('pin2')) { toast('Die PINs stimmen nicht überein'); return; }
    w.pin = fd.get('pin');
  }
  if (w.step === 4) {
    const samples = fd.has('samples');
    state = { ...emptyState(), familyName:w.familyName, pin:w.pin, members:w.members,
              tasks: samples ? sampleTasks() : [], rewards: samples ? sampleRewards() : [] };
    closeModal(); save();
    Object.assign(ui, { view:'tasks', filter:'alle', unlocked:false });
    render(); toast('Einrichtung abgeschlossen');
    return;
  }
  w.step++; wizRender();
}

    <label class="field"><span>Emoji</span><input name="emoji" list="emojis" value="${esc(m.emoji)}" required></label>
    <datalist id="emojis">${EMOJIS.map(e => `<option value="${e}">`).join('')}</datalist>
    <div class="field"><span>Farbe</span><div class="swatches">${COLORS.map(c => `<label><input type="radio" name="color" value="${c}" ${c===m.color?'checked':''}><i style="background:${c}"></i></label>`).join('')}</div></div>
    ${formButtons(!!id)}</form>`, fd => {
      const data = { name:fd.get('name').trim(), emoji:fd.get('emoji').trim(), color:fd.get('color') || m.color };
      if (id) Object.assign(m, data); else state.members.push({ id:uid(), active:true, ...data });
    });
  // Entfernte Mitglieder bleiben in der Historie sichtbar und verschwinden nur aus dem Alltag.
  modal.del = id ? () => { m.active = false; if (ui.filter === id) ui.filter = 'alle'; } : null;
}
function taskHistForm(id) {
  const h = state.taskHistory.find(x => x.id === id);
  modal(`<h2>Eintrag ändern</h2><form data-form="modal">
    <label class="field"><span>Datum</span><input name="date" type="date" value="${esc(h.date)}" required></label>
    <label class="field"><span>Person</span><select name="memberId">${memberOptions(h.memberId)}</select></label>
    <label class="field"><span>Aufgabe</span><input name="name" value="${esc(h.name)}" required></label>
    <div class="two">
      <label class="field"><span>Status</span><select name="status">${options([['Erledigt','Erledigt'],['Nicht erledigt','Nicht erledigt']],h.status)}</select></label>
      <label class="field"><span>Punkte</span><input name="points" type="number" min="0" value="${h.points}" required></label>
    </div>
    ${formButtons(true)}</form>`, fd => {
      const status = fd.get('status');
      Object.assign(h, { date:fd.get('date'), memberId:fd.get('memberId'), name:fd.get('name').trim(), status,
        points: status === 'Erledigt' ? number(fd.get('points')) : 0 });
    });
  modal.del = () => { state.taskHistory = state.taskHistory.filter(x => x.id !== id); };
}
function rewardHistForm(id) {
  const h = state.rewardHistory.find(x => x.id === id);
  modal(`<h2>Eintrag ändern</h2><form data-form="modal">
    <label class="field"><span>Datum</span><input name="date" type="date" value="${esc(h.date)}" required></label>
    <label class="field"><span>Person</span><select name="memberId">${memberOptions(h.memberId)}</select></label>
    <label class="field"><span>Belohnung</span><input name="name" value="${esc(h.name)}" required></label>
    <label class="field"><span>Kosten</span><input name="cost" type="number" min="0" value="${h.cost}" required></label>
    ${formButtons(true)}</form>`, fd => {
      Object.assign(h, { date:fd.get('date'), memberId:fd.get('memberId'), name:fd.get('name').trim(), cost:number(fd.get('cost')) });
    });
  modal.del = () => { state.rewardHistory = state.rewardHistory.filter(x => x.id !== id); };
}
function whoDidIt(inst) {
  modal(`<h2>Wer hat „${esc(inst.task.name)}“ erledigt?</h2><div class="tiles" style="margin:0 0 8px">
    ${activeMembers().map(m => `<button class="tile" data-act="bonusBy" data-id="${m.id}"><span class="emo">${esc(m.emoji)}</span><span class="name">${esc(m.name)}</span></button>`).join('')}
    </div><div class="actions"><button class="btn ghost" data-act="close">Abbrechen</button></div>`);
  modal.inst = inst;
}
function redeem(r) {
  modal(`<h2>Wer löst ${esc(r.name)} ein?</h2><p class="muted">Kostet ${r.cost} Punkte.</p><div class="tiles" style="margin:0 0 8px">
    ${activeMembers().map(m => { const b = balance(m.id); return `<button class="tile" data-act="redeemBy" data-id="${m.id}" ${b<r.cost?'disabled':''}>
      <span class="emo">${esc(m.emoji)}</span><span class="name">${esc(m.name)}</span><span class="sub">${b} Punkte</span></button>`; }).join('')}
    </div><div class="actions"><button class="btn ghost" data-act="close">Abbrechen</button></div>`);
  modal.reward = r;
}

/* --------- Ereignisse --------- */
function toggle(btn) {
  const day = today();
  const task = state.tasks.find(t => t.id === btn.dataset.task);
  const inst = { task, slot:Number(btn.dataset.slot), memberId: btn.dataset.member || null };
  const h = findEntry(day, inst);
  if (h) { state.taskHistory = state.taskHistory.filter(x => x !== h); save(); render(); return; }
  if (task.type === 'Pflicht') { state.taskHistory.push(entry(day, inst, inst.memberId, true)); save(); render(); return; }
  if (ui.filter !== 'alle') { state.taskHistory.push(entry(day, inst, ui.filter, true)); save(); render(); toast(`+${task.points} Punkte für ${mName(ui.filter)}`); return; }
  whoDidIt(inst);
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  if (a === 'veil') { if (e.target === el && !wiz) closeModal(); return; }
  const acts = {
    nav() { ui.view = el.dataset.v; render(); },
    filter() { ui.filter = id; render(); },
    toggle() { toggle(el); },
    lock() { ui.unlocked = false; render(); },
    adminTab() { ui.admin = el.dataset.v; render(); },
    taskForm() { taskForm(id); }, rewardForm() { rewardForm(id); }, memberForm() { memberForm(id); },
    taskHistForm() { taskHistForm(id); }, rewardHistForm() { rewardHistForm(id); },
    close() { closeModal(); },
    del() { if (!confirm('Wirklich löschen?')) return; modal.del(); save(); closeModal(); render(); },
    redeem() { redeem(state.rewards.find(r => r.id === id)); },
    bonusBy() { const i = modal.inst; state.taskHistory.push(entry(today(), i, id, true)); save(); closeModal(); render(); toast(`+${i.task.points} Punkte für ${mName(id)}`); },
    redeemBy() { const r = modal.reward; state.rewardHistory.push({ id:uid(), date:today(), memberId:id, name:r.name, cost:r.cost }); save(); closeModal(); render(); toast(`${r.name} für ${mName(id)} eingelöst`); },
    exportData() {
      const url = URL.createObjectURL(new Blob([JSON.stringify(state, null, 2)], { type:'application/json' }));
      const a = document.createElement('a');
      a.href = url; a.download = `punktlandung-${today()}.json`;
      document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
    },
    resetDemo() { if (confirm('Alle Daten durch Demodaten ersetzen?')) { state = demoState(); save(); ui.filter='alle'; render(); } },
    wizStart() { wizStart(); },
    wizBack() { wiz.step--; wizRender(); },
    wizAdd() { const f = $('#modal form'); if (wizAddMember(f)) wizRender(); else f.name.focus(); },
    wizDel() { wiz.members.splice(Number(el.dataset.i), 1); wizRender(); },
  };
  acts[a]?.();
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const form = e.target, fd = new FormData(form), kind = form.dataset.form;
  if (kind === 'unlock') {
    if (fd.get('pin') === state.pin) { ui.unlocked = true; render(); } else toast('PIN stimmt nicht');
  } else if (kind === 'wiz') {
    wizSubmit(form, fd);
  } else if (kind === 'settings') {
    state.familyName = fd.get('familyName').trim(); state.pin = fd.get('pin').trim(); save(); render(); toast('Gespeichert');
  } else if (kind === 'modal' && onSubmit) {
    onSubmit(fd); save(); closeModal(); render();
  }
});

document.addEventListener('change', async e => {
  if (e.target.id !== 'importFile' || !e.target.files[0]) return;
  try {
    const data = JSON.parse(await e.target.files[0].text());
    const lists = ['members','tasks','rewards','taskHistory','rewardHistory'];
    if (!data || !lists.every(k => Array.isArray(data[k])) || !/^\d{4}-\d{2}-\d{2}$/.test(data.lastClosed)) throw 0;
    if (!confirm('Alle aktuellen Daten durch diese Sicherung ersetzen?')) return;
    state = { ...emptyState(), ...data };
    closeDays(); save(); ui.filter = 'alle'; render(); toast('Sicherung eingespielt');
  } catch { toast('Diese Datei ist keine gültige Sicherung'); }
  finally { e.target.value = ''; }
});

// Tablet bleibt über Nacht an: Datumswechsel erkennen
setInterval(() => { if (ui.day !== today()) { ui.day = today(); closeDays(); render(); } }, 60000);

navigator.storage?.persist?.().catch(() => {}); // Browser bitten, die Daten nicht aufzuräumen
closeDays();
save();
render();
</script>
</body>
</html>
