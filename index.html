<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Punktlandung</title>
<meta name="apple-mobile-web-app-title" content="Punktlandung">
<meta name="theme-color" content="#F5EFE3">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root {
    --primary: #216D5D;
    --primary-soft: #E3F0EB;
    --sage: #A7C957;
    --coral: #F78B7F;
    --honey: #F8C951;
    --blue: #7DAEDB;
    --ivory: #F5EFE3;
    --gray: #6B7280;
    --ink: #17202B;
    --line: #E9E4DA;
    --chip: #EEF0F2;
    --shadow: 0 1px 2px rgba(23,32,43,.05), 0 6px 18px rgba(23,32,43,.05);
    --radius: 18px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    background: var(--ivory); color: var(--ink);
    font: 400 17px/1.35 Inter, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    padding-bottom: calc(92px + env(safe-area-inset-bottom));
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; padding: 0; text-align: inherit; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
  main { max-width: 1240px; margin: 0 auto; padding: 22px 22px 12px; }
  h1 { font-size: 32px; line-height: 1.15; margin: 0; font-weight: 700; letter-spacing: -.015em; }
  h2 { font-size: 22px; margin: 0 0 12px; font-weight: 650; letter-spacing: -.01em; }
  .muted { color: var(--gray); }
  .small { font-size: 15px; }
  .num { font-variant-numeric: tabular-nums; }
  svg.ic { width: 1.3em; height: 1.3em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; vertical-align: -.28em; }

  /* Avatare */
  .ava { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; flex: none; display: block; background: var(--chip); }
  span.ava { display: flex; align-items: center; justify-content: center; font-size: 36px; line-height: 1; }
  .ava.sm { width: 40px; height: 40px; } span.ava.sm { font-size: 23px; }
  .ava.xs { width: 26px; height: 26px; } span.ava.xs { font-size: 15px; }
  .ava.lg { width: 84px; height: 84px; } span.ava.lg { font-size: 46px; }
  .who { display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }

  /* Kopf */
  .top { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 18px; flex-wrap: wrap; }
  .stats { display: flex; gap: 10px; }
  .stat { background: #fff; border-radius: 14px; padding: 9px 16px; box-shadow: var(--shadow); display: flex; gap: 10px; align-items: center; }
  .stat svg { color: var(--primary); font-size: 20px; }
  .stat span { display: block; font-size: 13.5px; color: var(--gray); }
  .stat b { font-size: 20px; font-weight: 650; font-variant-numeric: tabular-nums; }

  .banner { display: flex; width: 100%; align-items: center; gap: 14px; background: #DCEAF6; border-radius: 16px; padding: 12px 16px; margin-bottom: 18px; min-height: 64px; }
  .banner.install { background: var(--primary-soft); }
  .banner-wrap { position: relative; }
  .banner-wrap .banner { padding-right: 56px; }
  .banner-wrap .x { top: 10px; right: 8px; }
  .howto { margin: 0 0 8px; padding: 0; list-style: none; counter-reset: s; }
  .howto li { counter-increment: s; display: flex; gap: 12px; align-items: center; padding: 9px 0; }
  .howto li::before { content: counter(s); width: 32px; height: 32px; border-radius: 50%; background: var(--primary-soft); color: var(--primary); font-weight: 650; display: flex; align-items: center; justify-content: center; flex: none; }
  .banner svg { color: var(--primary); }
  .banner .t { flex: 1; min-width: 0; }
  .banner b { display: block; font-weight: 650; }
  .banner span span { font-size: 15px; color: #3d4957; }

  /* Personen-Kacheln */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(132px, 1fr)); gap: 12px; margin-bottom: 24px; }
  .tile { background: #fff; border: 2px solid transparent; border-radius: var(--radius); box-shadow: var(--shadow); padding: 13px 8px; min-height: 142px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; text-align: center; }
  .tile .name { font-weight: 620; }
  .tile.on { border-color: var(--primary); }
  .chip { display: inline-flex; align-items: center; gap: 5px; font-size: 14.5px; font-weight: 600; padding: 4px 11px; border-radius: 10px; background: var(--chip); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .chip.tint { background: var(--c, var(--chip)); background: color-mix(in srgb, var(--c, #cfd4da) 28%, white); }
  .chip.p1 { background: #DCEAF6; } .chip.p2 { background: #FCEBB5; } .chip.p3 { background: #FDD9D5; }
  .chip.ok { background: var(--primary-soft); color: var(--primary); }
  .chip.bad { background: #FDE3E0; color: #8E2F24; }

  /* Aufgaben */
  .cols { display: grid; grid-template-columns: 1fr; gap: 24px; }
  @media (min-width: 880px) { .cols { grid-template-columns: 3fr 2fr; } }
  .list { display: flex; flex-direction: column; gap: 9px; }
  .row { width: 100%; min-height: 74px; display: flex; align-items: center; gap: 13px; padding: 8px 13px 8px 15px; background: #fff; border-radius: 15px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
  .row::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--c, transparent); }
  .thumb { width: 52px; height: 52px; object-fit: contain; flex: none; }
  span.thumb { display: flex; align-items: center; justify-content: center; color: var(--gray); font-size: 26px; background: var(--chip); border-radius: 12px; }
  .what { flex: 1; min-width: 0; }
  .what b { display: block; font-weight: 620; }
  .what .sub { font-size: 15px; color: var(--gray); display: flex; align-items: center; flex-wrap: wrap; gap: 4px 6px; margin-top: 2px; }
  .tick { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #CDD2D8; flex: none; display: flex; align-items: center; justify-content: center; color: #fff; }
  .tick svg { display: none; font-size: 15px; stroke-width: 3; }
  .row.done { background: rgba(255,255,255,.55); box-shadow: none; }
  .row.done .what b { color: var(--gray); text-decoration: line-through; text-decoration-thickness: 1px; }
  .row.done .thumb { opacity: .55; }
  .row.done .tick { background: var(--primary); border-color: var(--primary); }
  .row.done .tick svg { display: block; }
  .empty { padding: 18px; color: var(--gray); border: 1px dashed #D5CEC0; border-radius: 14px; text-align: center; }

  /* Belohnungen */
  .accounts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 26px; }
  .account { --c: #cfd4da; background: var(--c); background: color-mix(in srgb, var(--c) 30%, white); border-radius: var(--radius); padding: 14px 8px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .account .name { font-weight: 620; }
  .account .big { font-size: 38px; font-weight: 700; line-height: 1.1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .rewards { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 12px; margin-bottom: 26px; }
  .reward { background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 10px; min-height: 186px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 8px; text-align: center; }
  .reward .thumb { width: 84px; height: 84px; }
  .reward span.thumb { background: none; font-size: 54px; }
  .reward .chip { background: #FCEBB5; }
  .goal { display: flex; align-items: center; gap: 16px; background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 18px; margin-bottom: 26px; }
  .goal .thumb { width: 64px; height: 64px; }
  .goal .t { flex: 1; min-width: 0; }
  .goal b { font-size: 19px; font-weight: 650; }
  .goal .track { display: block; height: 14px; background: #F1EFEA; border-radius: 7px; overflow: hidden; margin: 7px 0 5px; }
  .goal .fill { display: block; height: 100%; background: var(--primary); border-radius: 7px; }
  .goal.won .fill { background: var(--sage); }
  .streak { background: rgba(255,255,255,.7); margin-top: 5px; }
  .streak svg { color: #C2571B; }
  .feed { display: flex; flex-direction: column; gap: 8px; }
  .feed div { display: flex; gap: 10px; align-items: center; background: #fff; border-radius: 12px; padding: 11px 14px; box-shadow: var(--shadow); }
  .feed svg { color: var(--gray); }
  .feed .t { flex: 1; min-width: 0; }
  .feed .m { color: #A83A2C; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* Karten und Tabellen */
  .panel { background: #fff; border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px; margin-bottom: 18px; }
  .narrow { max-width: 600px; }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 16px; }
  th { text-align: left; font-size: 14px; color: var(--gray); font-weight: 600; white-space: nowrap; }
  th, td { padding: 10px; border-bottom: 1px solid var(--line); }
  tbody tr:last-child td { border-bottom: 0; }
  tbody tr.click { cursor: pointer; }
  tbody tr.click:hover { background: #FBF9F4; }
  tr.inactive td { color: var(--gray); }
  td.num, th.num { text-align: right; }
  td .thumb { width: 34px; height: 34px; }
  td span.thumb { font-size: 18px; }

  /* Verwaltung */
  .subnav { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 16px; padding: 2px; }
  .subnav button { padding: 10px 16px; border-radius: 12px; white-space: nowrap; background: #fff; min-height: 46px; font-weight: 550; }
  .subnav button.on { background: var(--primary); color: #fff; }
  .bar-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .bar-head h2 { margin: 0; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 11px 20px; border-radius: 12px; font-weight: 620; background: var(--primary); color: #fff; min-height: 48px; border: 2px solid var(--primary); cursor: pointer; }
  .btn.ghost { background: #fff; color: var(--primary); }
  .btn.coral { background: var(--coral); border-color: var(--coral); color: var(--ink); }
  .btn.danger { background: #fff; color: #A83A2C; border-color: #E9BDB6; }
  .btn:disabled { background: #C9CDD2; border-color: #C9CDD2; color: #fff; cursor: not-allowed; }
  .btn.wide { width: 100%; }

  /* Statistik */
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(340px, 100%), 1fr)); gap: 18px; }
  .grid2 .panel { margin: 0; }
  .sub-h { margin-top: -8px; }
  .donut { display: flex; align-items: center; justify-content: center; position: relative; padding: 6px; }
  .donut svg { width: 180px; height: 180px; transform: rotate(-90deg); }
  .donut circle { fill: none; stroke-width: 12; }
  .donut div { position: absolute; text-align: center; }
  .donut b { display: block; font-size: 36px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .bars { display: flex; flex-direction: column; gap: 11px; }
  .bar { display: grid; grid-template-columns: 138px 1fr 58px; gap: 10px; align-items: center; font-size: 16px; }
  .bar .track { height: 14px; background: #F1EFEA; border-radius: 4px; display: block; overflow: hidden; }
  .bar .fill { display: block; height: 100%; background: var(--c, var(--primary)); border-radius: 4px; }
  .bar .val { text-align: right; font-variant-numeric: tabular-nums; }
  .bar .lbl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 7px; }
  .columns { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; align-items: end; height: 170px; }
  .col { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; gap: 3px; font-size: 12.5px; color: var(--gray); }
  .col i { display: block; width: 100%; max-width: 22px; background: var(--primary); border-radius: 4px 4px 0 0; }
  .col em { font-style: normal; color: var(--ink); font-variant-numeric: tabular-nums; }
  .rank { display: flex; flex-direction: column; gap: 9px; }
  .rank .rk { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; }
  .rank .t { flex: 1; min-width: 0; }
  .rank b { font-variant-numeric: tabular-nums; font-weight: 650; }
  button.bar { width: 100%; min-height: 40px; }
  .ph-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; padding-right: 40px; }
  .ph-head h2 { margin: 0; padding: 0; }
  .ph-sum { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
  .ph-sum div { background: var(--chip); border-radius: 12px; padding: 8px; text-align: center; font-size: 13.5px; color: var(--gray); }
  .ph-sum b { display: block; font-size: 20px; color: var(--ink); font-weight: 650; font-variant-numeric: tabular-nums; }
  .ph-row { display: flex; align-items: center; gap: 10px; padding: 10px 2px; border-bottom: 1px solid var(--line); }
  .ph-row:last-child { border-bottom: 0; }
  .ph-row .t { flex: 1; min-width: 0; }
  .ph-row .d { display: block; font-size: 14px; color: var(--gray); }
  .ph-row b { white-space: nowrap; font-weight: 650; font-variant-numeric: tabular-nums; color: var(--primary); }
  .ph-row b.minus { color: #A83A2C; }
  .medal { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; background: var(--chip); flex: none; }
  .medal.m1 { background: var(--honey); } .medal.m2 { background: #D8DCE1; } .medal.m3 { background: #EDB98C; }

  /* Navigation */
  nav.main { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: grid; grid-template-columns: repeat(4, 1fr); background: #fff; box-shadow: 0 -4px 18px rgba(23,32,43,.06); padding-bottom: env(safe-area-inset-bottom); }
  nav.main button { padding: 10px 4px 11px; min-height: 76px; color: var(--gray); font-size: 14.5px; font-weight: 550; text-align: center; position: relative; }
  nav.main svg { display: block; margin: 0 auto 3px; font-size: 22px; }
  nav.main button.on { color: var(--primary); font-weight: 650; }
  nav.main button.on::after { content: ""; position: absolute; left: 50%; bottom: 5px; width: 56px; height: 4px; margin-left: -28px; border-radius: 2px; background: var(--primary); }

  /* Dialog */
  .veil { position: fixed; inset: 0; background: rgba(23,32,43,.45); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  .modal { background: #fff; border-radius: 22px; padding: 22px; width: min(580px, 100%); max-height: calc(100% - 32px); overflow: auto; position: relative; }
  .modal h2 { font-size: 24px; padding-right: 40px; }
  .x { position: absolute; right: 12px; top: 12px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: var(--gray); }
  .field { display: block; margin-bottom: 13px; }
  .field > span { display: block; font-size: 15px; color: var(--gray); margin-bottom: 5px; }
  .field input:not([type=checkbox]):not([type=radio]):not([type=file]), .field select { width: 100%; padding: 12px; border: 1px solid #D9DCE0; border-radius: 11px; background: #fff; min-height: 50px; }
  input.pin { text-align: center; font-size: 24px; letter-spacing: .4em; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; align-items: center; }
  .actions .left { margin-right: auto; }
  .hidden { display: none !important; }
  .nowrap-start { justify-content: flex-start; margin: 0; }

  .toggle { display: flex; align-items: center; gap: 12px; min-height: 44px; margin-bottom: 8px; cursor: pointer; }
  .toggle input { position: absolute; opacity: 0; }
  .toggle i { width: 54px; height: 32px; border-radius: 16px; background: #C9CDD2; position: relative; transition: background .15s; flex: none; }
  .toggle i::after { content: ""; position: absolute; left: 3px; top: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 3px rgba(0,0,0,.25); }
  .toggle input:checked + i { background: var(--primary); }
  .toggle input:checked + i::after { transform: translateX(22px); }
  .toggle input:focus-visible + i { outline: 3px solid var(--primary); outline-offset: 2px; }

  .stepper { display: grid; grid-template-columns: 50px 1fr 50px; gap: 6px; }
  .stepper button { background: var(--chip); border-radius: 11px; font-size: 24px; text-align: center; min-height: 50px; }
  .stepper input { text-align: center; -moz-appearance: textfield; }
  .field .stepper input:not([type=checkbox]):not([type=radio]):not([type=file]) { padding: 12px 2px; min-width: 0; }
  .stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; }

  /* Auswahl-Kacheln: Symbole, Personen, Wochentage, Typ */
  .pickers { display: flex; gap: 7px; flex-wrap: wrap; }
  .pickers label { cursor: pointer; position: relative; }
  .pickers input { position: absolute; opacity: 0; }
  .pickers i { display: flex; align-items: center; justify-content: center; gap: 7px; min-width: 54px; height: 54px; font-size: 26px; font-style: normal; border-radius: 13px; border: 2px solid var(--line); background: #fff; }
  .pickers i img { width: 40px; height: 40px; object-fit: contain; }
  .pickers.text i { font-size: 16px; font-weight: 550; height: 46px; padding: 0 13px; min-width: 50px; }
  .pickers.text i .ava { width: 28px; height: 28px; font-size: 16px; }
  .pickers input:checked + i { border-color: var(--primary); background: var(--primary-soft); }
  .pickers.solid input:checked + i { background: var(--primary); color: #fff; }
  .pickers input:focus-visible + i { outline: 3px solid var(--primary); outline-offset: 2px; }
  .pickers.tall { max-height: 196px; overflow-y: auto; padding: 2px; }
  .preset-cat h3 { font-size: 16px; margin: 14px 0 8px; font-weight: 650; }
  .presets { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 8px; }
  .preset { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px; padding: 9px 6px; border: 1px solid var(--line); border-radius: 13px; min-height: 124px; }
  .preset .thumb { width: 46px; height: 46px; }
  .preset b { font-size: 15px; font-weight: 600; line-height: 1.2; }
  .preset span.muted { font-size: 13px; margin-top: auto; }
  .swatches { display: flex; gap: 10px; flex-wrap: wrap; }
  .swatches label { position: relative; cursor: pointer; }
  .swatches input { position: absolute; opacity: 0; }
  .swatches i { display: block; width: 44px; height: 44px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 1px var(--line); }
  .swatches input:checked + i { box-shadow: 0 0 0 3px var(--ink); }
  .swatches input:focus-visible + i { outline: 3px solid var(--primary); outline-offset: 3px; }
  .photo { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .photo .opts { display: flex; gap: 8px; flex-wrap: wrap; flex: 1; }
  .photo .btn { min-height: 44px; padding: 8px 12px; font-size: 15.5px; }
  .photo input { display: none; }

  .crop-veil { position: fixed; inset: 0; z-index: 15; background: rgba(23,32,43,.6); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .crop-box { background: #fff; border-radius: 22px; padding: 18px; width: min(380px, 100%); max-height: calc(100% - 16px); overflow: auto; }
  .crop-box h2 { margin-bottom: 4px; }
  .crop-stage { position: relative; width: 100%; aspect-ratio: 1; margin: 10px 0 12px; border-radius: 14px; overflow: hidden; background: #2b3038; touch-action: none; cursor: grab; }
  .crop-stage:active { cursor: grabbing; }
  .crop-stage canvas { display: block; width: 100%; height: 100%; }
  .crop-stage::after { content: ""; position: absolute; inset: 0; border-radius: 50%; box-shadow: 0 0 0 200px rgba(23,32,43,.5); pointer-events: none; outline: 2px solid #fff; outline-offset: -2px; }
  .crop-zoom { display: flex; align-items: center; gap: 10px; min-height: 44px; }
  .crop-zoom input { flex: 1; accent-color: var(--primary); height: 32px; }
  .pick { display: flex; align-items: center; gap: 12px; padding: 10px 4px; border-bottom: 1px solid var(--line); width: 100%; cursor: pointer; }
  .pick:last-of-type { border-bottom: 0; }
  .pick .t { flex: 1; min-width: 0; }
  .pick b { display: block; font-weight: 620; }
  .pick input { width: 26px; height: 26px; accent-color: var(--primary); flex: none; margin: 0; }
  .pick.off { cursor: not-allowed; }
  .pick.off .ava { opacity: .55; }

  .steps { display: flex; align-items: flex-start; margin: 0 0 18px; }
  .steps div { flex: 1; text-align: center; font-size: 13.5px; color: var(--gray); position: relative; }
  .steps b { display: flex; width: 34px; height: 34px; margin: 0 auto 3px; border-radius: 50%; align-items: center; justify-content: center; background: var(--chip); color: var(--ink); font-weight: 650; position: relative; z-index: 1; }
  .steps div:not(:first-child)::before { content: ""; position: absolute; left: -50%; right: 50%; top: 16px; height: 2px; background: #D9DCE0; }
  .steps .on { color: var(--primary); font-weight: 650; }
  .steps .on b { background: var(--primary); color: #fff; }
  .steps .past b { background: var(--primary-soft); color: var(--primary); }

  .sel-start { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 10px; min-height: 44px; }

/* --------- Fachlogik --------- */
function isDue(task, day) {
  if (!task.active || day < task.start) return false;
  if (task.rec === 'wochentag') return parseKey(day).getDay() === Number(task.weekday);
  if (task.rec === 'intervall') return diffDays(day, task.start) % Math.max(1, Number(task.interval)) === 0;
  return true;
}
const featureOn = (type, s = state) => s.features?.[type === 'Bonus' ? 'bonus' : 'pflicht'] !== false;
/* person ist 'alle' (auch künftige Mitglieder), 'offen' (Bonus), eine Liste von
   Mitgliedern oder bei älteren Exporten eine einzelne Mitglieds-ID. */
const taskPeople = t => Array.isArray(t.person) ? t.person : t.person === 'alle' || t.person === 'offen' ? [] : [t.person];
/* Tagesaufgaben werden aus den Regeln berechnet, nicht vorab gespeichert. */
function instances(s, day) {
  const out = [];
  const active = s.members.filter(m => m.active);
  for (const task of s.tasks) {
    if (!isDue(task, day) || !featureOn(task.type, s)) continue;
    const people = task.type === 'Bonus' ? [null]
      : task.person === 'alle' ? active.map(m => m.id)
      : taskPeople(task).filter(id => active.some(m => m.id === id));
    for (const memberId of people)
      for (let slot = 1; slot <= task.times; slot++) out.push({ task, memberId, slot });
  }
  return out;
}
/* Zusammen erledigt: Einträge einer Bonusaufgabe tragen dieselbe group und werden gemeinsam zurückgenommen */
const groupOf = h => h.group ? state.taskHistory.filter(x => x.group === h.group) : [h];
const sharedPoints = p => Math.max(1, Math.round(Number(p) * state.share.percent / 100));
const histName = h => h.name + (h.group ? ' (zusammen)' : '');
function entry(day, inst, memberId, ok) {
  return { id:uid(), date:day, taskId:inst.task.id, slot:inst.slot, memberId,
           name:inst.task.name, status: ok ? 'Erledigt' : 'Nicht erledigt', points: ok ? Number(inst.task.points) : 0 };
}
function findEntry(day, inst) {
  return state.taskHistory.find(h => h.date === day && h.taskId === inst.task.id && h.slot === inst.slot
    && (inst.memberId === null || h.memberId === inst.memberId));
}
/* Punkte sind immer aus den Historien abgeleitet, nie separat gespeichert.
   Dadurch wirken Admin-Korrekturen sofort. */
function balance(memberId) {
  let sum = 0;
  for (const h of state.taskHistory) if (h.memberId === memberId && h.status === 'Erledigt') sum += Number(h.points);
  for (const h of state.rewardHistory) if (h.memberId === memberId) sum -= Number(h.cost);
  return sum;
}
const STREAK_TASK = 'streak';
const GRADE_TASK = 'grade';
const isGrade = h => h.taskId === GRADE_TASK;
const isTaskEntry = h => h.taskId !== STREAK_TASK && !isGrade(h);
/* Familienziel: Punkte aller seit Montag. Es zählt nur mit, Punkte werden nicht abgezogen. */
function weekPoints() {
  const t = today(), monday = addDays(t, -((parseKey(t).getDay() + 6) % 7));
  return state.taskHistory.filter(h => h.status === 'Erledigt' && isTaskEntry(h) && h.date >= monday && h.date <= t)
    .reduce((a, h) => a + Number(h.points), 0);
}
/* Serie: aufeinanderfolgende Tage mit allen Pflichtaufgaben. Tage ohne Pflichtaufgaben
   unterbrechen sie nicht, ein noch offener heutiger Tag zählt erst, wenn er fertig ist. */
function streaks() {
  const t = today(), bonusIds = new Set(state.tasks.filter(x => x.type === 'Bonus').map(x => x.id));
  const openToday = new Set(instances(state, t).filter(i => i.memberId && !findEntry(t, i)).map(i => i.memberId));
  const out = {};
  for (const m of state.members) {
    const days = {};
    for (const h of state.taskHistory) {
      if (h.memberId !== m.id || !isTaskEntry(h) || bonusIds.has(h.taskId) || h.date > t) continue;
      if (h.status === 'Erledigt') days[h.date] ??= true; else days[h.date] = false;
    }
    let run = 0; const milestones = [];
    for (const d of Object.keys(days).sort()) {
      if (d === t && openToday.has(m.id)) continue;
      run = days[d] ? run + 1 : 0;
      if (run && run % Math.max(1, state.streak.every) === 0) milestones.push({ date:d, run });
    }
    out[m.id] = { run, milestones };
  }
  return out;
}
/* Bonuspunkte stehen als eigene Einträge in der Historie und werden hier mit den
   Serien abgeglichen. Korrigiert der Admin einen Tag, passt sich der Bonus von selbst an.
   Einträge vor streak.since bleiben unangetastet. */
function syncStreakBonus() {
  const cfg = state.streak;
  if (!cfg?.active) return [];
  const want = new Map(), since = cfg.since, s = streaks();
  for (const [memberId, v] of Object.entries(s))
    for (const k of v.milestones) if (k.date >= since) want.set(`streak-${memberId}-${k.date}`, { ...k, memberId });
  const before = state.taskHistory.length;
  state.taskHistory = state.taskHistory.filter(h => h.taskId !== STREAK_TASK || h.date < since || want.has(h.id));
  const have = new Set(state.taskHistory.map(h => h.id)), added = [];
  for (const [id, k] of want) if (!have.has(id)) {
    const h = { id, date:k.date, taskId:STREAK_TASK, slot:0, memberId:k.memberId, name:`Serien-Bonus (${k.run} Tage)`, status:'Erledigt', points:Number(cfg.points) };
    state.taskHistory.push(h); added.push(h);
  }
  syncStreakBonus.changed = added.length > 0 || state.taskHistory.length !== before;
  return added;
}
/* Tagesabschluss: offene Pflichtaufgaben vergangener Tage werden zu „Nicht
   erledigt“. Läuft beim Öffnen und beim Datumswechsel; holt verpasste Tage nach. */
function closeDays() {
  const t = today();
  let day = addDays(state.lastClosed, 1);
  if (diffDays(t, day) > 62) day = addDays(t, -62);
  let changed = false;
  while (day < t) {
    for (const inst of instances(state, day))
      if (inst.task.type === 'Pflicht' && !findEntry(day, inst)) {
        state.taskHistory.push(entry(day, inst, inst.memberId, false));
        changed = true;
      }
    state.lastClosed = day; changed = true;
    day = addDays(day, 1);
  }
  if (changed) save();
}

  const f = ui.filter;
  const must = all.filter(i => i.task.type === 'Pflicht' && (f === 'alle' || i.memberId === f))
    .sort((a,b) => (!!a.h - !!b.h) || state.members.findIndex(m=>m.id===a.memberId) - state.members.findIndex(m=>m.id===b.memberId));
  const bonus = all.filter(i => i.task.type === 'Bonus').sort((a,b) => !!a.h - !!b.h);
  const open = must.filter(i => !i.h).length + bonus.filter(i => !i.h).length;
  const openOf = id => all.filter(i => !i.h && i.memberId === id).length;

  const pf = featureOn('Pflicht'), bo = featureOn('Bonus');
  const tiles = activeMembers().map(m =>
    `<button class="tile ${f===m.id?'on':''}" style="--c:${esc(m.color)}" data-act="filter" data-id="${m.id}" aria-pressed="${f===m.id}">

function bars(rows) {

      <span class="val">${esc(r.text ?? r.v)}</span></${tag}>`; }).join('')}</div>`;

function viewStats() {
  const t = today(), from = addDays(t, -30);
  const done = state.taskHistory.filter(h => h.status === 'Erledigt');
  const doneTasks = done.filter(isTaskEntry);
  const label = m => ({ l:`${avatar(m,'xs')}<span>${esc(m.name)}</span>`, plain:m.name, c:m.color, id:m.id });
  const isMust = h => isTaskEntry(h) && state.tasks.find(x => x.id === h.taskId)?.type !== 'Bonus';
  const window30 = state.taskHistory.filter(h => h.date >= from && h.date < t && isMust(h));
  const quote = activeMembers().map(m => {
    const hs = window30.filter(h => h.memberId === m.id);
    const ok = hs.filter(h => h.status === 'Erledigt').length;
    return { ...label(m), v:ok, max:hs.length || 1, text:`${ok}/${hs.length}`, pct: hs.length ? ok/hs.length : 0 };
  }).map(r => ({ ...r, v:r.pct, max:1 }));
  const totalDone = window30.filter(h => h.status === 'Erledigt').length;
  const pct = window30.length ? Math.round(totalDone / window30.length * 100) : 0;
  const circ = 2 * Math.PI * 80;
  const rank = activeMembers().map(m => ({ m, v: done.filter(h => h.memberId === m.id).reduce((a,h) => a + Number(h.points), 0) })).sort((a,b) => b.v-a.v);
  const months = [], now = new Date();
  for (let i = 11; i >= 0; i--) {

    const ym = `${d.getFullYear()}-${pad(d.getMonth()+1)}`;
    months.push({ l:MONTHS[d.getMonth()], name:`${MONTHS[d.getMonth()]} ${d.getFullYear()}`, v: done.filter(h => h.date.startsWith(ym)).reduce((a,h) => a + Number(h.points), 0) });
  }
  const mMax = Math.max(1, ...months.map(m => m.v));
  const count = (arr, f) => { const c = {}; arr.forEach(x => c[f(x)] = (c[f(x)]||0)+1);
    return Object.entries(c).sort((a,b) => b[1]-a[1]).slice(0,5).map(([k,v]) => ({ l:`<span style="overflow:hidden;text-overflow:ellipsis">${esc(k)}</span>`, plain:k, v })); };
  return `
    <div class="top"><h1>Statistik</h1></div>
    <div class="grid2">
      ${featureOn('Pflicht') ? `<div class="panel"><h2>Gesamtquote</h2><p class="muted small sub-h">Pflichtaufgaben, letzte 30 Tage</p>
        <div class="donut"><svg viewBox="0 0 180 180" role="img" aria-label="${pct} Prozent erledigt"><circle cx="90" cy="90" r="80" stroke="#E3F0EB"/><circle cx="90" cy="90" r="80" stroke="#216D5D" stroke-linecap="round" stroke-dasharray="${circ*pct/100} ${circ}"/></svg>
        <div><b>${pct}%</b><span class="muted small">erledigt</span></div></div></div>
      <div class="panel"><h2>Aufgaben je Mitglied</h2><p class="muted small sub-h">Erledigt von fällig, letzte 30 Tage</p>${bars(quote)}</div>` : ''}
      <div class="panel"><h2>Rangliste</h2><p class="muted small sub-h">Gesammelte Punkte. Name antippen für die Punkte-Historie.</p>
        <div class="rank">${rank.map((r,i) => `<button class="rk" data-act="pointHistory" data-id="${esc(r.m.id)}"><span class="medal m${i+1}">${i+1}</span>${avatar(r.m,'sm')}<span class="t">${esc(r.m.name)}</span><b>${r.v}</b></button>`).join('')}</div></div>
      <div class="panel"><h2>Punkte pro Monat</h2><p class="muted small sub-h">Ganze Familie</p>
        <div class="columns">${months.map(m => `<div class="col" title="${m.name}: ${m.v} Punkte"><em>${m.v || ''}</em><i style="height:${m.v/mMax*118}px"></i>${m.l}</div>`).join('')}</div></div>

    </div>`;
}

/* Foto zuschneiden: verschieben mit Finger oder Maus, vergrößern mit zwei Fingern, Regler oder
   Mausrad. Gespeichert wird nur der gewählte Ausschnitt, verkleinert für den lokalen Speicher. */
function cropPhoto(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    const fail = () => { URL.revokeObjectURL(url); reject(new Error('Foto nicht lesbar')); };
    img.onerror = fail;
    img.onload = () => {
      const box = document.createElement('div');
      box.className = 'crop-veil';
      box.innerHTML = `<div class="crop-box" role="dialog" aria-modal="true"><h2>Foto zuschneiden</h2>
        <p class="muted small" style="margin:0">Mit dem Finger verschieben, mit zwei Fingern oder dem Regler vergrößern.</p>
        <div class="crop-stage"><canvas></canvas></div>
        <label class="crop-zoom"><span class="muted small">Vergrößern</span><input type="range" min="1" max="4" step="0.01" value="1" aria-label="Vergrößern"></label>
        <div class="actions"><button type="button" class="btn ghost" data-crop="no">Abbrechen</button><button type="button" class="btn" data-crop="ok">Übernehmen</button></div></div>`;
      document.body.append(box);
      const stage = box.querySelector('.crop-stage'), canvas = box.querySelector('canvas'), range = box.querySelector('input');
      const S = stage.clientWidth, dpr = Math.min(2, devicePixelRatio || 1), W = img.naturalWidth, H = img.naturalHeight;
      canvas.width = canvas.height = Math.round(S * dpr);
      const base = S / Math.min(W, H);
      let zoom = 1, ox = 0, oy = 0;
      const clamp = () => {
        const mx = (W * base * zoom - S) / 2, my = (H * base * zoom - S) / 2;
        ox = Math.max(-mx, Math.min(mx, ox)); oy = Math.max(-my, Math.min(my, oy));
      };
      const paint = (ctx, size) => {
        const f = size / S, sc = base * zoom;
        ctx.drawImage(img, (S/2 - W*sc/2 + ox) * f, (S/2 - H*sc/2 + oy) * f, W*sc*f, H*sc*f);
      };
      const draw = () => { clamp(); paint(canvas.getContext('2d'), canvas.width); };
      const setZoom = z => { const old = zoom; zoom = Math.max(1, Math.min(4, z)); ox *= zoom/old; oy *= zoom/old; range.value = zoom; draw(); };
      const finish = data => { box.remove(); URL.revokeObjectURL(url); resolve(data); };
      const touches = new Map(); let spread = 0;
      const gap = () => { const [a, b] = [...touches.values()]; return Math.hypot(a.x-b.x, a.y-b.y); };
      stage.addEventListener('pointerdown', e => { stage.setPointerCapture(e.pointerId); touches.set(e.pointerId, { x:e.clientX, y:e.clientY }); if (touches.size === 2) spread = gap(); });
      stage.addEventListener('pointermove', e => {
        const t = touches.get(e.pointerId);
        if (!t) return;
        const dx = e.clientX - t.x, dy = e.clientY - t.y;
        t.x = e.clientX; t.y = e.clientY;
        if (touches.size === 1) { ox += dx * S / stage.getBoundingClientRect().width; oy += dy * S / stage.getBoundingClientRect().height; draw(); }
        else if (touches.size === 2) { const g = gap(); if (spread) setZoom(zoom * g / spread); spread = g; }
      });
      const lift = e => { touches.delete(e.pointerId); spread = 0; };
      stage.addEventListener('pointerup', lift); stage.addEventListener('pointercancel', lift);
      stage.addEventListener('wheel', e => { e.preventDefault(); setZoom(zoom * (e.deltaY < 0 ? 1.08 : .93)); }, { passive:false });
      range.addEventListener('input', () => setZoom(Number(range.value)));
      box.addEventListener('click', e => {
        const a = e.target.closest('[data-crop]')?.dataset.crop;
        if (a === 'no') finish(null);
        if (a === 'ok') {
          const out = document.createElement('canvas'); out.width = out.height = 256;
          paint(out.getContext('2d'), 256);
          finish(out.toDataURL('image/jpeg', .82));
        }
      });
      draw();
    };
    img.src = url;
  });
}

/* --------- Automatische Updates ---------
   Offene Apps prüfen stündlich und beim Zurückholen in den Vordergrund, ob eine neue
   Version vorliegt. Sie laden nur neu, wenn gerade kein Dialog offen ist. */
async function checkUpdate() {
  if (!onWeb || !navigator.onLine || APP_VERSION === 'dev') return;
  try {
    const res = await fetch('./', { cache:'no-cache' });
    const remote = (await res.text()).match(/APP_VERSION = '(\w+)'/)?.[1];
    if (remote && remote !== APP_VERSION && !$('#modal').innerHTML) location.reload();
  } catch { /* ohne Netz einfach beim nächsten Mal */ }
}
function announceUpdate() {
  const known = flag.get('punktlandung.version');
  flag.set('punktlandung.version', APP_VERSION);
  if (known && known !== APP_VERSION) toast('App wurde aktualisiert');
}

function toggle(btn) {
  const day = today();
  const task = state.tasks.find(t => t.id === btn.dataset.task);
  const inst = { task, slot:Number(btn.dataset.slot), memberId: btn.dataset.member || null };
  const h = findEntry(day, inst);
  if (h) { undoTask(h, task); return; }
  if (task.type === 'Pflicht') { state.taskHistory.push(entry(day, inst, inst.memberId, true)); save(); render(); toast('Aufgabe erledigt!', `+${task.points} Punkte`); return; }
  if (state.share.active && activeMembers().length > 1) { shareDialog(inst); return; }
  if (ui.filter !== 'alle') { bonusDone(inst, [ui.filter]); return; }
  whoDidIt(inst);
}

/* iPad: Teilen-Menü (AirDrop, Dateien, Mail). Sonst normaler Download. */

  const file = new File([blob], name, { type:'application/json' });
  if (navigator.canShare?.({ files:[file] })) {
    try { await navigator.share({ files:[file] }); return; }
    catch (err) { if (err.name === 'AbortError') return; }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');

  } else if (kind === 'settings') {
    state.familyName = fd.get('familyName').trim(); state.pin = fd.get('pin').trim(); save(); render(); toast('Gespeichert');
  } else if (kind === 'modal' && onSubmit) {
    if (onSubmit(fd) === false) return;
    save(); closeModal(); render();
  }
});
document.addEventListener('input', e => {
  if (e.target.id !== 'presetSearch') return;
  const q = e.target.value.trim().toLowerCase();
  let hits = 0;
  document.querySelectorAll('.preset').forEach(b => { const on = b.dataset.n.includes(q); b.classList.toggle('hidden', !on); hits += on; });
  document.querySelectorAll('.preset-cat').forEach(c => c.classList.toggle('hidden', !c.querySelector('.preset:not(.hidden)')));
  $('#presetNone').classList.toggle('hidden', hits > 0);
});
document.addEventListener('change', async e => {
  const feature = e.target.dataset?.feature;
  if (feature) {
    const on = e.target.checked;
    if (feature === 'pflicht' || feature === 'bonus') state.features = { ...state.features, [feature]:on };
    if (feature === 'share') state.share = { ...state.share, active:on };
    if (feature === 'grades') state.grades = { ...state.grades, active:on };
    if (feature === 'goal') state.goal = { ...state.goal, active:on };
    if (feature === 'streak') state.streak = { ...state.streak, active:on, since:today() };
    if (feature === 'bonus' || feature === 'pflicht') ui.filter = 'alle';
    save(); render(); toast(on ? 'Eingeschaltet' : 'Ausgeschaltet');
    return;
  }
  if (e.target.matches('[data-photo]') && e.target.files[0]) {
    const file = e.target.files[0];
    e.target.value = '';
    try { const data = await cropPhoto(file); if (data) { photoDraft = data; photoRefresh(modal.photoBase); } }
    catch { toast('Dieses Foto konnte nicht gelesen werden', '', true); }
    return;
  }
  if (e.target.id !== 'importFile' || !e.target.files[0]) return;
  try {
    const data = JSON.parse(await e.target.files[0].text());
    const lists = ['members','tasks','rewards','taskHistory','rewardHistory'];
    if (!data || !lists.every(k => Array.isArray(data[k])) || !/^\d{4}-\d{2}-\d{2}$/.test(data.lastClosed)) throw 0;
    const people = data.members.filter(m => m.active).length;
    if (!confirm(`„${data.familyName}“ importieren?\n${people} Personen, ${data.taskHistory.length} Aufgaben-Einträge, ${data.rewardHistory.length} Belohnungen.\n\nAlle Daten auf diesem Gerät werden ersetzt. Danach gilt die PIN aus der Datei.`)) return;
    state = { ...emptyState(), ...data };
    closeDays(); save(); ui.filter = 'alle'; render(); toast('Daten importiert');
  } catch { toast('Diese Datei ist kein gültiger Export', '', true); }
  finally { e.target.value = ''; }
});

phoneQuery.addEventListener('change', () => { if (!$('#modal').innerHTML) render(); });

// Tablet bleibt über Nacht an: Datumswechsel erkennen
setInterval(() => { if (ui.day !== today()) { ui.day = today(); closeDays(); render(); } }, 60000);

navigator.storage?.persist?.().catch(() => {}); // Browser bitten, die Daten nicht aufzuräumen
closeDays();
save();
render();
announceUpdate();
if (onWeb && 'serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
setInterval(checkUpdate, 3600000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkUpdate(); });
</script>
</body>
</html>
